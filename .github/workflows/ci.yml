name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run unit tests
        env:
          MLFLOW_TRACKING_URI: file:./mlruns
          PYTHONPATH: .
        run: |
          pytest -q

      - name: Smoke run (train → score → monitor on sample data)
        env:
          MLFLOW_TRACKING_URI: file:./mlruns
          PYTHONPATH: .
        run: |
          python scripts/generate_logs.py
          python -m src.pipeline.train --data data/raw/all.log --experiment ci-exp
          python -m src.pipeline.score --data data/raw/all.log --experiment ci-exp --topk 50
          python -m src.pipeline.monitor --experiment ci-exp

      - name: Upload outputs (for debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-outputs
          path: |
            outputs/
            mlruns/
