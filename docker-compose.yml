services:
  mlflow:
    image: python:3.11-slim
    working_dir: /mlflow
    volumes:
      - ./mlruns:/mlflow/mlruns
    ports:
      - "5000:5000"
    command: >
      bash -lc "
      pip install --no-cache-dir mlflow &&
      mlflow server
        --backend-store-uri /mlflow/mlruns
        --default-artifact-root /mlflow/mlruns
        --host 0.0.0.0
        --port 5000
      "
